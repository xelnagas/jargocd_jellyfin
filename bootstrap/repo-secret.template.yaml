# ==============================================================================
# Modèle de Secret Kubernetes pour Argo CD Repository (SSH)
# ATTENTION : Ne JAMAIS commiter ce fichier avec la clé réelle remplie !
# Ce fichier sert de référence structurelle ou de base pour le déploiement CI/CD.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: repo-argocd-git
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: ssh://julien@192.168.1.160/home/julien/argocd.git
  insecureIgnoreHostKey: "true"
  # Valeur injectée depuis GitHub Secret: ${{ secrets.SSH_PRIVATE_KEY }}
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <COLLER_LA_CLE_PRIVEE_ICI_SI_APPLICATION_LOCALE>
    -----END OPENSSH PRIVATE KEY-----
