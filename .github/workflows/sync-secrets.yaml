name: Sync Secrets to Kubernetes

on:
  workflow_dispatch:

jobs:
  sync-secrets:
    name: Apply GitHub Secrets to Argo CD Namespace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure Kubeconfig
        if: "${{ env.HAS_KUBECONFIG != '' }}"
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          HAS_KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Argo CD Repo Secret
        if: "${{ env.HAS_KUBECONFIG != '' && env.HAS_SSH_KEY != '' }}"
        env:
          HAS_KUBECONFIG: ${{ secrets.KUBECONFIG }}
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic repo-argocd-git \
            -n argocd \
            --type=Opaque \
            --from-literal=type=git \
            --from-literal=url=ssh://julien@192.168.1.160/home/julien/argocd.git \
            --from-literal=sshPrivateKey="$SSH_KEY" \
            --from-literal=insecureIgnoreHostKey=true \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl label secret repo-argocd-git -n argocd argocd.argoproj.io/secret-type=repository --overwrite
          echo "Secret repo-argocd-git synchronisé avec succès."
