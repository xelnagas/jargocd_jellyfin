name: Lint & Validate Kubernetes Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Kustomize Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.8.1"

      - name: Validate Jellyfin Base
        run: |
          kustomize build manifests/workloads/jellyfin/base

      - name: Validate Jellyfin Overlay Prod
        run: |
          kustomize build manifests/workloads/jellyfin/overlays/prod

      - name: Check for latest tags (Anti-Pattern Check)
        run: |
          if grep -rn "image:.*:latest" manifests/; then
            echo "::error::Interdiction formelle du tag :latest conforme a normeetprojet.md"
            exit 1
          fi
